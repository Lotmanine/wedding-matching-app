name: PHPUnit and Pint

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  test:
    name: PHPUnit suite, Pint on changed files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the Pint step can list the files changed by the push.
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, sqlite3, gd, bcmath, intl, zip
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install JS dependencies & build assets
        run: |
          npm ci
          npm run build

      # Full PHPUnit suite on in-memory SQLite (database settings come from phpunit.xml).
      - name: Run tests (composer test)
        run: composer test

      # Pint in test mode on the PHP files added or changed by this push or pull request.
      - name: Check code style of changed PHP files (Pint)
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA=$(git rev-parse HEAD~1)
          fi
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- '*.php' ':!*.blade.php')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PHP file changed since $BASE_SHA."
            exit 0
          fi
          printf 'Checking %s\n' "${files[@]}"
          ./vendor/bin/pint --test "${files[@]}"
