services:
  app:
    build:
      context: ../..
      dockerfile: deployment/coolify/Dockerfile
    ports:
      - "8080:80"
    env_file:
      - ../../.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  mysql:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wedding_prod
      MARIADB_USER: wedding
      MARIADB_PASSWORD: secret
      MARIADB_ROOT_PASSWORD: rootsecret
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  mysql_data:
